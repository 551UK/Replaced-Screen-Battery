name: Build rootless package

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # SpringBoard is arm64e. iOS 14+ requires the new arm64e ABI, which must be
    # linked with Apple's ld64 from Xcode rather than the Linux Theos toolchain.
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Normalize Settings icon size
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Resources/icon@3x.png "$tmp/source.png"

          make_icon() {
            inner="$1"
            canvas="$2"
            output="$3"
            sips --resampleHeightWidth "$inner" "$inner" "$tmp/source.png" --out "$tmp/small.png" >/dev/null
            sips --padToHeightWidth "$canvas" "$canvas" "$tmp/small.png" --out "$output" >/dev/null
          }

          make_icon 23 29 Resources/icon.png
          make_icon 46 58 Resources/icon@2x.png
          make_icon 69 87 Resources/icon@3x.png

      - name: Check out Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: Check out patched iOS 16.5 SDK
        uses: actions/checkout@v6
        with:
          repository: xybp888/iOS-SDKs
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install build dependencies
        run: brew install make xz ldid

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Build rootless deb
        env:
          THEOS: ${{ github.workspace }}/theos
        run: gmake clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: Replaced-Screen-Battery-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Remove older GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: v1.0.15
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\") | .id" |
          while IFS= read -r release_id; do
            gh api --method DELETE \
              "repos/${{ github.repository }}/releases/${release_id}"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: Replaced Screen & Battery v1.0.15
          body: |
            Rootless build for iOS 15.2–18.5.

            Hides replaced display/battery warnings and Settings badge contributions while keeping Battery Health & Charging accessible.

            v1.0.15 fixes the replacement-battery warning filter removing the Battery Health & Charging row. For unverified replacement batteries, Maximum Capacity is now shown from the installed BMS/gas-gauge data using Full Charge Capacity / Design Capacity, capped at 100% for display. Genuine/verification status is not changed.

            The existing iOS 18 Parts & Service History hooks remain included. Enable the tweak and respring after installation.
          files: packages/*.deb
          make_latest: true
