name: Build rootless package

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # SpringBoard is arm64e. iOS 14+ requires the new arm64e ABI, which must be
    # linked with Apple's ld64 from Xcode rather than the Linux Theos toolchain.
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Normalize Settings icon size
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Resources/icon@3x.png "$tmp/source.png"

          make_icon() {
            inner="$1"
            canvas="$2"
            output="$3"
            sips --resampleHeightWidth "$inner" "$inner" "$tmp/source.png" --out "$tmp/small.png" >/dev/null
            sips --padToHeightWidth "$canvas" "$canvas" "$tmp/small.png" --out "$output" >/dev/null
          }

          make_icon 23 29 Resources/icon.png
          make_icon 46 58 Resources/icon@2x.png
          make_icon 69 87 Resources/icon@3x.png

      - name: Check out Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: Check out patched iOS 16.5 SDK
        uses: actions/checkout@v6
        with:
          repository: xybp888/iOS-SDKs
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install build dependencies
        run: brew install make xz ldid

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Build rootless deb
        env:
          THEOS: ${{ github.workspace }}/theos
        run: gmake clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: Replaced-Screen-Battery-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Remove older GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: v1.0.14
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\") | .id" |
          while IFS= read -r release_id; do
            gh api --method DELETE \
              "repos/${{ github.repository }}/releases/${release_id}"
          done

      - name: Preserve supplied iOS 16 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/blobs/4bf7a4f1a3227e3a5edb9e8ab85eaa257feb7345" --jq '.content' | base64 --decode > 'iOS-16-ONLY.com.551.replacedscreenbattery_1.0.13_iphoneos-arm64.deb'
          echo 'b92fa8a15deca743d63fd09ee11125fc3d2785aba647c5daa2d720c95f30a107  iOS-16-ONLY.com.551.replacedscreenbattery_1.0.13_iphoneos-arm64.deb' | shasum -a 256 --check

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: Replaced Screen & Battery v1.0.14
          body: |
            Rootless build retaining iOS 15–16 support, with additional iOS 18 hooks.

            Hides both replaced display and battery warnings and removes both Settings badge contributions. It also includes a master enable/disable switch, Respring button, and repository link in Settings.

            v1.0.14 targets the whole Parts & Service History section in General > About on iOS 18, including asynchronous refreshes and section spacing. The existing iOS 16 hooks are unchanged.

            Enable the tweak and respring after installation.
          files: |
            packages/*.deb
            iOS-16-ONLY.com.551.replacedscreenbattery_1.0.13_iphoneos-arm64.deb
          make_latest: true
